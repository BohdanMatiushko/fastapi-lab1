services:
  db:
    image: postgres:16
    container_name: database_ZeroX
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: ZeroX_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      - RELOAD=1
    # бо запуск тепер через entrypoint.sh

volumes:
  pgdata: